<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <!-- Household A Query -->
  <g>
    <rect x="30" y="60" width="140" height="80" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Casa Alfa</text>
    <text x="100" y="115" text-anchor="middle" font-size="11" fill="#9d9da6">JWT: household_a</text>
  </g>
  <!-- Household B Query -->
  <g>
    <rect x="30" y="160" width="140" height="80" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b">Casa Beta</text>
    <text x="100" y="215" text-anchor="middle" font-size="11" fill="#9d9da6">JWT: household_b</text>
  </g>
  <!-- PostgreSQL RLS Engine -->
  <g>
    <rect x="240" y="70" width="230" height="160" rx="14" fill="#18181b" stroke="#10b981" stroke-width="2.5"/>
    <text x="355" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#10b981">PostgreSQL RLS Engine</text>
    <text x="355" y="130" text-anchor="middle" font-size="12" fill="#f4f4f5">Security Invariance</text>
    <text x="355" y="155" text-anchor="middle" font-size="11" fill="#9d9da6">USING (auth.uid() IN members)</text>
    <text x="355" y="180" text-anchor="middle" font-size="11" fill="#9d9da6">Filtragem no nível de kernel</text>
    <text x="355" y="205" text-anchor="middle" font-size="11" fill="#10b981">Bug no front não vaza dado</text>
  </g>
  <!-- Isolated Results -->
  <g>
    <rect x="540" y="60" width="180" height="80" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <text x="630" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Dados Casa Alfa</text>
    <text x="630" y="115" text-anchor="middle" font-size="11" fill="#9d9da6">Somente seus registros</text>
  </g>
  <g>
    <rect x="540" y="160" width="180" height="80" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
    <text x="630" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b">Dados Casa Beta</text>
    <text x="630" y="215" text-anchor="middle" font-size="11" fill="#9d9da6">Isolamento absoluto</text>
  </g>
  <line x1="170" y1="100" x2="235" y2="120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="200" x2="235" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="120" x2="535" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="180" x2="535" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="275" text-anchor="middle" font-size="13" fill="#9d9da6">Segurança no motor do banco: a aplicação não precisa lembrar de filtrar</text>
</svg>