<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <!-- panel mock -->
  <rect x="60" y="50" width="260" height="220" rx="14" fill="none" stroke="#8a8a93" stroke-width="2"/>
  <text x="190" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#9d9da6">painel /ops</text>
  <rect x="85" y="100" width="210" height="34" rx="8" fill="none" stroke="#8a8a93" stroke-width="1.5"/>
  <text x="100" y="122" font-size="12" fill="#9d9da6">projeto: handoff-daemon</text>
  <rect x="85" y="144" width="210" height="34" rx="8" fill="none" stroke="#8a8a93" stroke-width="1.5"/>
  <text x="100" y="166" font-size="12" fill="#9d9da6">branch: qualquer uma</text>
  <rect x="85" y="196" width="210" height="38" rx="10" fill="#3b82f6"/>
  <text x="190" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Deploy</text>
  <!-- steps -->
  <line x1="328" y1="160" x2="392" y2="160" stroke="#8a8a93" stroke-width="2" marker-end="url(#arr5)"/>
  <g>
    <rect x="400" y="80" width="150" height="44" rx="10" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="475" y="107" text-anchor="middle" font-size="12" fill="#9d9da6">atualiza o código</text>
    <rect x="400" y="138" width="150" height="44" rx="10" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="475" y="165" text-anchor="middle" font-size="12" fill="#9d9da6">reconstrói o container</text>
    <rect x="400" y="196" width="150" height="44" rx="10" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="475" y="223" text-anchor="middle" font-size="12" fill="#9d9da6">sobe a versão nova</text>
  </g>
  <line x1="558" y1="160" x2="622" y2="160" stroke="#8a8a93" stroke-width="2" marker-end="url(#arr5)"/>
  <!-- live -->
  <g>
    <circle cx="665" cy="150" r="30" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <path d="M650 150 l9 9 l18 -20" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <text x="665" y="205" text-anchor="middle" font-size="13" fill="#10b981">no ar</text>
  </g>
  <text x="380" y="305" text-anchor="middle" font-size="13" fill="#9d9da6">o daemon inclusive se re-deploya: derruba o próprio container e volta na versão nova</text>
</svg>
