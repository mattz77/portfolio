<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <!-- timeline -->
  <line x1="60" y1="150" x2="700" y2="150" stroke="#8a8a93" stroke-width="2"/>
  <!-- checkpoints -->
  <g>
    <circle cx="140" cy="150" r="8" fill="#10b981"/>
    <text x="140" y="185" text-anchor="middle" font-size="12" fill="#9d9da6">checkpoint</text>
    <circle cx="260" cy="150" r="8" fill="#10b981"/>
    <text x="260" y="185" text-anchor="middle" font-size="12" fill="#9d9da6">checkpoint</text>
    <circle cx="380" cy="150" r="8" fill="#10b981"/>
    <text x="380" y="185" text-anchor="middle" font-size="12" fill="#9d9da6">checkpoint</text>
  </g>
  <!-- limit wall -->
  <rect x="455" y="90" width="10" height="120" rx="3" fill="#ef4444" opacity="0.75"/>
  <text x="460" y="75" text-anchor="middle" font-size="12" fill="#ef4444">memory limit</text>
  <!-- baton pass arc -->
  <path d="M390 140 Q460 60 545 140" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="468" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">baton passes</text>
  <!-- second model resumes -->
  <circle cx="560" cy="150" r="8" fill="#10b981"/>
  <text x="560" y="185" text-anchor="middle" font-size="12" fill="#9d9da6">another model resumes</text>
  <circle cx="670" cy="150" r="8" fill="#10b981"/>
  <text x="670" y="185" text-anchor="middle" font-size="12" fill="#9d9da6">work goes on</text>
  <!-- labels -->
  <text x="240" y="45" text-anchor="middle" font-size="13" fill="#9d9da6">model A working, saving progress at every step</text>
  <text x="380" y="255" text-anchor="middle" font-size="13" fill="#9d9da6">nothing is lost: whoever arrives reads the last checkpoint and continues</text>
</svg>
