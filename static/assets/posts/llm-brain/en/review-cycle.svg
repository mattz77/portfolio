<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <!-- circle of 5 agents -->
  <g>
    <rect x="315" y="30" width="130" height="52" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="380" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Review</text>
    <text x="380" y="70" text-anchor="middle" font-size="11" fill="#9d9da6">finds problems</text>

    <rect x="560" y="120" width="140" height="52" rx="12" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="630" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#9d9da6">Auditor</text>
    <text x="630" y="160" text-anchor="middle" font-size="11" fill="#9d9da6">drops the made-up ones</text>

    <rect x="480" y="280" width="130" height="52" rx="12" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="545" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#9d9da6">Fix</text>
    <text x="545" y="320" text-anchor="middle" font-size="11" fill="#9d9da6">fixes and opens a PR</text>

    <rect x="150" y="280" width="130" height="52" rx="12" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="215" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#9d9da6">Verifier</text>
    <text x="215" y="320" text-anchor="middle" font-size="11" fill="#9d9da6">checks the fix</text>

    <rect x="60" y="120" width="140" height="52" rx="12" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="130" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#9d9da6">CI-Fix</text>
    <text x="130" y="160" text-anchor="middle" font-size="11" fill="#9d9da6">repairs broken tests</text>
  </g>
  <!-- arrows around -->
  <path d="M450 70 Q560 85 610 112" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr4)"/>
  <path d="M628 178 Q615 240 590 274" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr4)"/>
  <path d="M472 306 Q380 330 288 306" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr4)"/>
  <path d="M200 274 Q160 235 140 180" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr4)"/>
  <path d="M150 112 Q230 70 307 56" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr4)"/>
  <!-- center -->
  <text x="380" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#10b981">the human only decides the merge</text>
  <text x="380" y="217" text-anchor="middle" font-size="12" fill="#9d9da6">the rest runs on its own, with a cap on rounds</text>
</svg>
