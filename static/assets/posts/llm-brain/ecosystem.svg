<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <!-- human -->
  <g>
    <circle cx="110" cy="120" r="34" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <circle cx="110" cy="108" r="9" fill="#8a8a93"/>
    <path d="M92 138 q18 -18 36 0" fill="none" stroke="#8a8a93" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="180" text-anchor="middle" font-size="14" fill="#9d9da6">você</text>
  </g>
  <!-- brain center -->
  <g>
    <rect x="300" y="70" width="160" height="100" rx="14" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="380" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#3b82f6">LLM-Brain</text>
    <text x="380" y="128" text-anchor="middle" font-size="12" fill="#9d9da6">memória compartilhada</text>
    <text x="380" y="148" text-anchor="middle" font-size="12" fill="#9d9da6">tasks · decisões · checkpoints</text>
  </g>
  <!-- agents -->
  <g>
    <rect x="580" y="30" width="130" height="54" rx="12" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="645" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#9d9da6">Claude</text>
    <text x="645" y="70" text-anchor="middle" font-size="11" fill="#9d9da6">código · deploy</text>
    <rect x="580" y="106" width="130" height="54" rx="12" fill="none" stroke="#8a8a93" stroke-width="2"/>
    <text x="645" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#9d9da6">opencode</text>
    <text x="645" y="146" text-anchor="middle" font-size="11" fill="#9d9da6">Kimi K3 · GPT 5.6</text>
    <rect x="580" y="182" width="130" height="54" rx="12" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="645" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981">daemon</text>
    <text x="645" y="222" text-anchor="middle" font-size="11" fill="#9d9da6">trabalha 24/7</text>
  </g>
  <!-- links -->
  <line x1="150" y1="120" x2="292" y2="120" stroke="#8a8a93" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="466" y1="95" x2="572" y2="62" stroke="#8a8a93" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="466" y1="120" x2="572" y2="132" stroke="#8a8a93" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="466" y1="150" x2="572" y2="204" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <!-- footer note -->
  <text x="380" y="300" text-anchor="middle" font-size="13" fill="#9d9da6">um pedido humano · vários agentes · uma memória só</text>
</svg>
