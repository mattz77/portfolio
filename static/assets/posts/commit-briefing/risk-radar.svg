<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Card 1: Bus Factor -->
  <g>
    <rect x="50" y="60" width="190" height="160" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="145" cy="100" r="22" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="145" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ef4444">!</text>
    <text x="145" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Bus Factor</text>
    <text x="145" y="168" text-anchor="middle" font-size="12" fill="#9d9da6">Concentração &gt; 60%</text>
    <text x="145" y="188" text-anchor="middle" font-size="11" fill="#71717a">em autor único</text>
  </g>
  <!-- Card 2: Toil Alert -->
  <g>
    <rect x="285" y="60" width="190" height="160" rx="14" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="380" cy="100" r="22" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="380" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">⚡</text>
    <text x="380" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Alerta de Toil</text>
    <text x="380" y="168" text-anchor="middle" font-size="12" fill="#9d9da6">Repetição &gt; 40%</text>
    <text x="380" y="188" text-anchor="middle" font-size="11" fill="#71717a">tarefas sem automação</text>
  </g>
  <!-- Card 3: Sensitive Core -->
  <g>
    <rect x="520" y="60" width="190" height="160" rx="14" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="615" cy="100" r="22" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="615" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#3b82f6">🛡</text>
    <text x="615" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Área Sensível</text>
    <text x="615" y="168" text-anchor="middle" font-size="12" fill="#9d9da6">Mudanças no Core</text>
    <text x="615" y="188" text-anchor="middle" font-size="11" fill="#71717a">auth, db, infraestrutura</text>
  </g>
  <text x="380" y="260" text-anchor="middle" font-size="13" fill="#9d9da6">Heurísticas explícitas baseadas em Git real — nunca inferências sem evidência</text>
</svg>