<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <g>
    <rect x="40" y="100" width="140" height="90" rx="10" fill="#18181b" stroke="#8a8a93" stroke-width="2"/>
    <text x="110" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f4f5">Tarefa Recebida</text>
    <text x="110" y="155" text-anchor="middle" font-size="11" fill="#9d9da6">Prompt / Ferramentas</text>
  </g>
  <!-- Primary Provider with Error -->
  <g>
    <rect x="250" y="40" width="180" height="90" rx="10" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <text x="340" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444">Provedor Primário</text>
    <text x="340" y="90" text-anchor="middle" font-size="11" fill="#9d9da6">HTTP 429 · Rate Limit</text>
    <text x="340" y="110" text-anchor="middle" font-size="10" fill="#ef4444">Circuit Breaker Aberto</text>
  </g>
  <!-- Fallback Provider -->
  <g>
    <rect x="250" y="160" width="180" height="90" rx="10" fill="#18181b" stroke="#10b981" stroke-width="2"/>
    <text x="340" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981">Fallback Secundário</text>
    <text x="340" y="210" text-anchor="middle" font-size="11" fill="#9d9da6">Modelo Alternativo</text>
    <text x="340" y="230" text-anchor="middle" font-size="10" fill="#10b981">Estado Preservado</text>
  </g>
  <!-- Output -->
  <g>
    <rect x="500" y="100" width="180" height="90" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <text x="590" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Entrega Concluída</text>
    <text x="590" y="155" text-anchor="middle" font-size="11" fill="#9d9da6">Zero perda de contexto</text>
  </g>
  <line x1="180" y1="130" x2="245" y2="85" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="180" y1="160" x2="245" y2="205" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="205" x2="495" y2="155" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="280" text-anchor="middle" font-size="13" fill="#9d9da6">Resiliência ativa: failover transparente entre provedores sem intervenção manual</text>
</svg>