<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <!-- Event Trigger -->
  <g>
    <rect x="30" y="100" width="120" height="80" rx="10" fill="#18181b" stroke="#8a8a93" stroke-width="2"/>
    <text x="90" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f4f5">Evento / App</text>
    <text x="90" y="155" text-anchor="middle" font-size="11" fill="#9d9da6">Webhook HTTP</text>
  </g>
  <!-- n8n Orchestrator -->
  <g>
    <rect x="195" y="70" width="165" height="140" rx="14" fill="#18181b" stroke="#ea580c" stroke-width="2.5"/>
    <text x="277" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">n8n Engine</text>
    <text x="277" y="130" text-anchor="middle" font-size="12" fill="#f4f4f5">Orquestração</text>
    <text x="277" y="150" text-anchor="middle" font-size="11" fill="#9d9da6">Versionado em Docker</text>
    <text x="277" y="170" text-anchor="middle" font-size="11" fill="#9d9da6">Observabilidade nó a nó</text>
    <text x="277" y="190" text-anchor="middle" font-size="10" fill="#10b981">Retry com backoff</text>
  </g>
  <!-- LLM Pool -->
  <g>
    <rect x="405" y="40" width="140" height="90" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <text x="475" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Model Router</text>
    <text x="475" y="90" text-anchor="middle" font-size="11" fill="#9d9da6">Claude · GPT · Kimi</text>
    <text x="475" y="110" text-anchor="middle" font-size="10" fill="#71717a">Sem vendor lock-in</text>
  </g>
  <!-- MCP Server -->
  <g>
    <rect x="405" y="160" width="140" height="90" rx="10" fill="#18181b" stroke="#10b981" stroke-width="2"/>
    <text x="475" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981">MCP Server</text>
    <text x="475" y="210" text-anchor="middle" font-size="11" fill="#9d9da6">Contratos Rígidos</text>
    <text x="475" y="230" text-anchor="middle" font-size="10" fill="#71717a">JSON Schema Tools</text>
  </g>
  <!-- Real Resources -->
  <g>
    <rect x="590" y="100" width="140" height="80" rx="10" fill="#18181b" stroke="#8a8a93" stroke-width="2"/>
    <text x="660" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f4f5">Recursos Reais</text>
    <text x="660" y="155" text-anchor="middle" font-size="11" fill="#9d9da6">PostgreSQL · APIs</text>
  </g>
  <!-- Connectors -->
  <line x1="150" y1="140" x2="190" y2="140" stroke="#8a8a93" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="115" x2="400" y2="85" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="165" x2="400" y2="195" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="545" y1="205" x2="585" y2="160" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="290" text-anchor="middle" font-size="13" fill="#9d9da6">n8n orquestra o fluxo de controle · MCP isola o acesso a dados reais</text>
</svg>