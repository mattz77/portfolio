# Redireciona o alias antes de servir conteúdo, concentrando sinais SEO no host canônico.
server {
    listen 80;
    server_name www.nicebyte.ia.br;
    return 301 https://nicebyte.ia.br$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # The pages are prerendered and meant to be indexed. Explicit so the origin
    # never contributes a noindex; if an edge/proxy still sends
    # "x-robots-tag: noindex", it is being added in front of nginx.
    # Repeated per location: an add_header in a nested block drops every header
    # inherited from the server level, so it cannot be declared only once here.
    add_header X-Robots-Tag "index, follow" always;

    location = /robots.txt {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sitemap.xml {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fingerprintable static assets — cache 1 year
    location ~* \.(woff2|png|jpg|jpeg|svg|ico|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # App scripts (.js/.jsx, transpiled at runtime) + HTML — always revalidate
    location ~* \.(jsx|js|html)$ {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # healthz
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Never emit "http://localhost/..." in redirects when running behind a proxy
    absolute_redirect off;

    # Prerendered routes are directories (blog/index.html, post/<slug>/index.html).
    # Serving their index directly avoids a 301 to the trailing-slash form, which
    # would fight the canonical URL (/blog) written into every page.
    # Unknown paths fall back to the SPA shell.
    # As rotas prerenderizadas são diretórios, e URL de diretório ("/seo-local/") não casa a
    # regex de .html acima. Sem esta declaração a página sai sem Cache-Control e fica sujeita à
    # heurística de cache de quem estiver na frente, que já prendeu uma republicação antes.
    location / {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
        try_files $uri $uri/index.html /index.html;
    }

    # /seo-local/ e /demo/ são páginas prerenderizadas, não rotas da SPA. Com o fallback
    # para /index.html um caminho inexistente devolvia o portfólio com HTTP 200: foi assim que
    # "/seo-local/solicitar/", antes de ser publicado, abriu a home ao ser lido pelo QR Code.
    # Soft 404 engana o Google e esconde erro de publicação. Aqui responde 404 de verdade.
    location /seo-local/ {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
        try_files $uri $uri/index.html =404;
    }

    location /demo/ {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
        try_files $uri $uri/index.html =404;
    }

    # Entrega de laudo é individual: caminho inexistente responde 404, nunca a home.
    # Com o fallback da SPA, "/laudos/chute" devolvia 200 e atrapalhava tanto o Google
    # quanto qualquer auditoria de vazamento.
    location /laudos/ {
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
        try_files $uri $uri/index.html =404;
    }
}
